<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxiViewer - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 max-w-md mx-auto">
    <h1 class="text-xl font-bold text-center mb-4">TaxiViewer Control Panel</h1>

    <!-- Control Buttons with Stop Buttons -->
    <div class="grid grid-cols-2 gap-2 mb-4">
        <button onclick="sendReq('front-cam')" class="bg-blue-600 text-white p-3 rounded-lg text-sm font-semibold">ရှေ့ Camera</button>
        <button onclick="stopStream()" class="bg-red-600 text-white p-3 rounded-lg text-sm font-semibold">ရှေ့/နောက် ပိတ်ရန်</button>

        <button onclick="sendReq('back-cam')" class="bg-blue-600 text-white p-3 rounded-lg text-sm font-semibold">နောက် Camera</button>
        <button onclick="stopStream()" class="bg-red-600 text-white p-3 rounded-lg text-sm font-semibold">ကင်မရာ ပိတ်ရန်</button>

        <button onclick="sendReq('mic')" class="bg-emerald-600 text-white p-3 rounded-lg text-sm font-semibold">Mic စစ်ဆေးရန်</button>
        <button onclick="stopStream()" class="bg-red-600 text-white p-3 rounded-lg text-sm font-semibold">Mic ပိတ်ရန်</button>

        <button onclick="sendReq('screen')" class="bg-purple-600 text-white p-3 rounded-lg text-sm font-semibold">Screen ကြည့်ရန်</button>
        <button onclick="stopStream()" class="bg-red-600 text-white p-3 rounded-lg text-sm font-semibold">Screen ပိတ်ရန်</button>

        <button onclick="sendReq('location')" class="bg-amber-600 text-white p-3 rounded-lg text-sm font-semibold col-span-2">Location ကြည့်ရန်</button>
    </div>

    <p id="viewStatus" class="text-center text-sm font-medium text-gray-600 mb-3">Ready to connect</p>

    <!-- Display Screen / Video Output -->
    <div class="bg-black rounded-xl h-64 flex items-center justify-center overflow-hidden relative">
        <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>
        <div id="locationInfo" class="absolute bottom-2 left-2 bg-black/70 text-white text-xs p-2 rounded hidden"></div>
    </div>

    <!-- Firebase SDK & App logic -->
    <script type="module" src="app.js"></script>
</body>
</html>
